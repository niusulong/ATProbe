# 环境配置（env.yaml）：跨用例共享、可修改的测试参数。
#
# 用例通过 {{group.param}} 点号引用这些值（如 {{tcp.host}}、{{ctwing.port}}），
# 避免把服务器地址/端口/域名硬编码进用例。换测试环境只改本文件，不动用例。
# 详见 skill「测试参数 env 化」规范 + references/env-params.md（全指令集参数清单）。
#
# 注意：port 一律用引号字符串（'8080'），避免 YAML 把纯数字端口误解析。
# 敏感值（password/secret）此处为占位，请替换为真实值，勿提交明文进版本库。

# --- 网络接入层 ---
pdp:
  apn: cmnet                 # 接入点名（AT+CGDCONT / AT+NETAPN）
  pdp_type: IP               # PDP 类型
  cid: '1'                   # PDP 上下文编号
  auth_type: '1'             # 鉴权 0NONE/1PAP/2CHAP
  auth_user: card            # 拨号用户名
  auth_password: '<占位password>'

dns:
  dns1: 114.114.114.114      # 首选 DNS（AT+DNSSERVER=1）
  dns2: 8.8.8.8              # 备选 DNS（AT+DNSSERVER=2）
  query_domain: example.com  # DNS 解析测试域名（AT+NWDNS）

# --- TCP/UDP 数据业务 ---
tcp:
  host: 192.168.1.100        # TCP 测试服务器 IP 或域名
  port: '8080'               # TCP 测试服务器端口

tcp_server:                  # 模组做 TCP/UDP 服务器场景
  listen_port: '6800'        # 模组侦听端口（AT+TCPLISTEN）
  client_host: 192.168.1.50  # 测试客户端 IP（断言 Connect 上报）
  client_port: '50000'       # 测试客户端源端口

ssl:                         # SSL TCP（加密，ch14）
  host: 192.168.1.100
  port: '4451'
  sslversion: '3'            # 0SSL3.0/1TLS1.0/2TLS1.1/3TLS1.2
  authmode: '0'              # 0不认证/1认证服务器/2双向
  cacert: ca.pem
  client_cert: cc.pem
  client_key: ck.pem

# --- 应用层协议 ---
http:
  host: 192.168.1.200
  port: '8080'
  url: 192.168.1.200/api/test       # 完整 URL（AT+HTTPPARA=url）
  base_url: /api
  https_url: example.com/secure/api # HTTPS 路径（AT+HTTPSPARA=url）
  https_port: '443'
  cacert: ca.pem

ftp:
  host: 192.168.1.100
  port: '21'
  user: test
  password: '<占位password>'
  path: /firmware
  filename: test.txt         # FTP 测试文件名（AT+FTPGET/FTPGETF）
  ftps_mode: '0'             # 0FTP/1显式FTPS/2隐式FTPS
  ftp_mode: '0'              # 0被动/1主动

ntp:
  host: time.windows.com     # 授时服务器（AT+UPDATETIME）
  port: '123'
  timeout: '10'              # 同步超时秒数（1-30，必填参数）
  timezone: E8               # 时区（影响 AT+CCLK? 校验）

# --- IoT 云平台 ---
mqtt:
  host: broker.example.com:1883  # broker 地址（url:port 合体，AT+MQTTCONN）
  port: '1883'
  client_id: atprobe_test
  username: atprobe_user
  password: '<占位password>'
  topic: test/cmd
  keep_alive: '60'

aliyun:                      # 阿里云物联网平台（ch15）
  srv_url: iot-cn-example.mqtt.iothub.aliyuncs.com
  product_key: a1Example01
  device_name: device001
  device_secret: '<占位secret32>'
  auth_mode: '0'             # 0一机一密/1一型一密/2x509/3直连
  keep_alive: '120'

aws:                         # AWS IoT（ch17，证书强制）
  endpoint: a1example.iot.us-east-2.amazonaws.com:443
  client_id: atprobe_aws_01
  topic: nwy_test/01
  keep_alive: '60'
  ca_cert: ca.pem
  client_cert: cc.pem
  client_key: ck.pem

ctwing:                      # 电信天翼物联网平台（手册外，外部生态预留）
  host: mqtt.ctwing.cn
  port: '1883'
  product_id: '00000000'
  device_name: device001
  device_secret: '<占位secret>'

pipecloud:                   # 有方管道云（ch33）
  server_url: iot.example.com
  server_port: '1883'

# --- 其它业务 ---
fota:
  version_a: V1.0.0
  version_b: V2.0.0
  http_url: fota.example.com/http/fota.bin    # HTTP FOTA 差分包（AT+NWFOTA）
  http_port: '80'
  https_url: fota.example.com/https/fota.bin
  https_port: '443'
  pkg_ab: fota_V1_to_V2.bin
  pkg_ba: fota_V2_to_V1.bin

sms:
  sca: '+8613800755500'      # 短信中心号码（随运营商变）
  dest_number: '13800138000'

netshare:                    # 网络共享 RNDIS/ECM（ch26）
  apn: ctnet
  username: card
  password: '<占位password>'
  auth_type: '1'
  share_mode: '0'            # 0RNDIS/1ECM

# --- 默认/设备 ---
default:
  apn: cmnet
device:
  model: N58
  test_number: '13800138000'
  imei: '000000000000000'
  software_version: V1.0.0
