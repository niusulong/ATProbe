# 环境配置（env.yaml）：跨用例共享、可修改的测试参数。
#
# 用例通过 {{group.param}} 点号引用这些值（如 {{tcp.host}}、{{ctwing.port}}），
# 避免把服务器地址/端口/域名硬编码进用例。换测试环境只改本文件，不动用例。
# 详见 skill「测试参数 env 化」规范。
#
# 注意：port 一律用引号字符串（'8080'），避免 YAML 把纯数字端口误解析（如 '80' 没问题
# 但带前导零或需保留类型时统一字符串更安全，且 AT 指令参数本就是 ASCII 文本）。

# --- TCP 业务：自有 TCP 测试服务器 ---
tcp:
  host: 192.168.1.100      # TCP 测试服务器 IP 或域名
  port: '8080'             # TCP 测试服务器端口

# --- CTM2M 业务：电信天翼物联网平台（ctwing）接入 ---
ctwing:
  host: mqtt.ctwing.cn     # ctwing 平台接入地址（IP 或域名）
  port: '1883'             # ctwing 平台接入端口
  product_id: '00000000'   # 产品 ID（ProductID，控制台分配）
  device_name: 'device001' # 设备名称（DeviceName）
  # DeviceSecret 为敏感信息，按需填写；用例通常不直接断言它，只用于触发注册/鉴权

# --- NTP 业务：授时服务器 ---
ntp:
  host: 210.72.145.44      # NTP 授时服务器 IP（国家授时中心）
  port: '123'              # NTP 端口

# --- FTP 业务 ---
ftp:
  host: 192.168.1.100
  port: '21'
  user: test
  password: '123456'
  path: /firmware

# --- HTTP 业务 ---
http:
  host: 192.168.1.200
  port: '8080'
  base_url: /api

# --- MQTT 业务（非 ctwing 的自有 broker） ---
mqtt:
  broker: 192.168.1.150
  port: '1883'
  client_id: atprobe_test
  topic: test/cmd

# --- FOTA 远程升级 ---
fota:
  version_a: V1.0.0
  version_b: V2.0.0
  pkg_ab: fota_V1_to_V2.bin
  pkg_ba: fota_V2_to_V1.bin

# --- 默认/通用 ---
default:
  apn: cmnet
device:
  model: EC600S
  test_number: '13800138000'
