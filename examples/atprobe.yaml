# ATProbe 配置文件示例（M5 §3.5）
# 命令行参数覆盖配置文件，配置文件覆盖内置默认值。

ports:                          # 默认端口列表（--port 未指定时使用）
  - COM3:115200:8N1

default:
  step_timeout: 5               # 步骤级默认超时（秒）
  baud: 115200                  # 默认波特率
  log_level: progress           # progress / debug

cases_dir: ./examples/testcases # 不提供用例路径时的默认加载目录
report_dir: ./reports           # HTML 报告输出目录
env_config: ./examples/env.yaml # 测试环境配置文件（M7）

console:
  color: true                   # 默认启用颜色；非终端环境自动忽略
  command_truncate: 40          # 控制台命令显示截断长度

log:
  dir: ./logs                   # 原始日志根目录（按会话留存，手动清理）

pressure:                       # 压测默认值
  pass_rate_threshold: 95       # 压测用例 PASS 阈值（成功率%）

# 噪声 URC 过滤（可选，默认不剥离）。设备存在持续性主动上报时配置——典型如
# N58 开启 GPS 循环输出（AT$MYGPSPOS=<TYPE>,1）后 $MYGPSPOS 行每秒到达 AT 口，
# 插队在命令应答之前的行会混入响应文本，干扰严格字节级断言。
# 语义：正则列表（对 strip 后的整行内容 search）；匹配行
#   - URC 事件照常派发给订阅者（监控不丢失）
#   - 从交付给断言的响应文本整段剥离（含紧邻空行，字节级还原）
# 注意：用例步骤的 wait_urc 目标行不受影响——逐命令的期待响应声明优先于
# 全局噪声声明（如 AT$MYGPSPOS=0,1 循环上报用例可在 filter 下照常断言）。
# urc_filter:
#   - '^\$MYGPSPOS:'
