name: Release

# 仅在推送 v*.*.* tag 时触发构建发布；普通 push 不构建。
# 流程：维护者改 pyproject.toml version → commit → git tag v<x.y.z> → git push origin v<x.y.z>
# Actions 自动构建并发布到该 tag 的 GitHub Release。
on:
  push:
    tags:
      - "v*.*.*"

# 需要写权限以创建 Release 并上传 asset
permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    env:
      # 强制 Python UTF-8 模式：Windows runner 默认 cp1252，print 中文会 UnicodeEncodeError。
      # 同时覆盖子进程（PyInstaller 等）的输出编码。
      PYTHONUTF8: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      - name: Sync dependencies（运行时 + PyInstaller）
        run: uv sync --extra gui --extra packaging

      - name: Build
        run: uv run python packaging/build.py

      - name: Generate SHA256 checksum（B9：下载校验用，checker 解析此文件做内容校验）
        shell: pwsh
        run: |
          $zip = Get-ChildItem dist/ATProbe-*-win64.zip | Select-Object -First 1
          $hash = (Get-FileHash $zip.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($zip.Name)" | Out-File -Encoding ascii "$($zip.FullName).sha256"
          Write-Host "SHA256: $hash"

      - name: Upload artifact（便于排查失败的构建）
        uses: actions/upload-artifact@v4
        with:
          name: ATProbe-win64-zip
          path: dist/ATProbe-*-win64.zip
          if-no-files-found: error

      - name: Sign release zip (minisign)
        # S-6：Release 必须带 minisign 签名。secret 未配置 → 显式失败（发布必须签名，
        # 不允许静默跳过）。激活步骤见 docs/user/update-signing.md。
        shell: pwsh
        env:
          MINISIGN_PRIVATE_KEY: ${{ secrets.MINISIGN_PRIVATE_KEY }}
          # 可选：私钥设置了保护密码时配置（经 stdin 传给 minisign，官方二进制
          # 不支持环境变量/命令行传密码——见 docs/user/update-signing.md）
          MINISIGN_KEY_PASSWORD: ${{ secrets.MINISIGN_KEY_PASSWORD }}
        run: |
          if (-not $env:MINISIGN_PRIVATE_KEY) { Write-Host "::error::未配置 MINISIGN_PRIVATE_KEY secret——发布必须签名（见 docs/user/update-signing.md）"; exit 1 }
          $keyFile = New-TemporaryFile
          Set-Content -Path $keyFile -Value $env:MINISIGN_PRIVATE_KEY
          # 下载 minisign（官方 release 二进制）
          Invoke-WebRequest -Uri "https://github.com/jedisct1/minisign/releases/download/0.12/minisign-0.12-win64.zip" -OutFile minisign.zip
          Expand-Archive minisign.zip -DestinationPath minisign
          $ms = (Get-ChildItem minisign -Recurse -Filter minisign.exe).FullName
          Get-ChildItem dist/*.zip | ForEach-Object {
            if ($env:MINISIGN_KEY_PASSWORD) {
              # 密码经 stdin 传入（无 tty 时 minisign 从 stdin 读密码）
              $env:MINISIGN_KEY_PASSWORD | & $ms -S -m $_.FullName -s $keyFile
            } else {
              & $ms -S -m $_.FullName -s $keyFile
            }
            if ($LASTEXITCODE -ne 0) { Write-Host "::error::minisign 签名失败（$($_.Name)）"; exit 1 }
          }
          Remove-Item $keyFile -Force
          Get-ChildItem dist/*.minisig | ForEach-Object { Write-Host "已生成签名：$($_.Name)" }

      - name: Create GitHub Release & upload zip + sha256 + minisig
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ATProbe-*-win64.zip
            dist/ATProbe-*-win64.zip.sha256
            dist/ATProbe-*-win64.zip.minisig
          generate_release_notes: true   # 自动从 commit 生成 changelog
          fail_on_unmatched_files: true
